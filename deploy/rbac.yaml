apiVersion: v1
kind: ServiceAccount
metadata:
  name: gpu-guardian-operator
  namespace: gpu-guardian-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gpu-guardian-operator
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["infra.milindsisodiya.dev"]
    resources: ["gpuhealthpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["infra.milindsisodiya.dev"]
    resources: ["gpuhealthpolicies/status"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gpu-guardian-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gpu-guardian-operator
subjects:
  - kind: ServiceAccount
    name: gpu-guardian-operator
    namespace: gpu-guardian-system
