apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gpuhealthpolicies.infra.milindsisodiya.dev
spec:
  group: infra.milindsisodiya.dev
  scope: Cluster
  names:
    plural: gpuhealthpolicies
    singular: gpuhealthpolicy
    kind: GPUHealthPolicy
    shortNames: ["ghp"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [nodeSelector, action]
              properties:
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                checkIntervalSeconds:
                  type: integer
                  default: 30
                xidErrorThreshold:
                  type: integer
                  default: 5
                eccErrorThreshold:
                  type: integer
                  default: 10
                action:
                  type: string
                  enum: ["cordon", "drain"]
            status:
              type: object
              properties:
                observedNodes:
                  type: integer
                unhealthyNodes:
                  type: array
                  items:
                    type: string
                lastReconcileAt:
                  type: string
      additionalPrinterColumns:
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: ObservedNodes
          type: integer
          jsonPath: .status.observedNodes
        - name: LastReconcile
          type: string
          jsonPath: .status.lastReconcileAt
